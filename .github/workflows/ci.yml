name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: sudo apt-get install -y shellcheck tmux
      - run: make check

  macos-test:
    # bin/cc-yank carries BSD stat/date fallbacks (GNU coreutils vs. the
    # BSD tools macOS ships) that ubuntu-latest never exercises.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test
